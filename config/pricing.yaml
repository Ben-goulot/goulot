# Tarifs de l'API Claude, en dollars US par million de tokens.
# Relevés le 3 octobre 2026, revérifiés le 15 octobre 2026 sur https://platform.claude.com/docs/en/about-claude/pricing
# À revérifier : le compteur de coût et les plafonds en dépendent.
checked_on: "2026-10-15"
models:
  claude-haiku-5-5:          # tri ; tarifs pour un prompt de 100 000 tokens au plus (cache compris)
    input: 0.10
    output: 0.50
    cache_write_5m: 0.125
    cache_write_1h: 0.20
    cache_read: 0.01
    long_prompt_threshold_tokens: 100000
    long_prompt:               # au-delà du seuil, toute la requête passe à ces tarifs
      input: 0.50
      output: 2.50
      cache_write_5m: 0.625
      cache_write_1h: 1.00
      cache_read: 0.05
  claude-haiku-4-5-20251001:  # ancien modèle de tri, gardé pour relire les coûts passés
    input: 1.00
    output: 5.00
    cache_write_5m: 1.25
    cache_write_1h: 2.00
    cache_read: 0.10
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write_5m: 2.50
    cache_write_1h: 4.00
    cache_read: 0.10
  claude-opus-5-5:          # non utilisé par défaut ; escalade possible pour un événement grave
    input: 4.00
    output: 20.00
    cache_write_5m: 5.00
    cache_write_1h: 8.00
    cache_read: 0.20
batch_discount: 0.5          # -50 % en traitement différé (Batch)
web_search_per_1000: 10.00   # recherche web, en plus des tokens
budgets_usd_per_month:
  watch: 5.00                # veille : économie à 80 %, règles seules à 100 %
  reconstruction: 10.00      # reconstructions : devis et confirmation avant chaque lancement
