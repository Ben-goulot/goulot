# Auto-merge of Dependabot patch updates once the required CI checks are green (docs/UPDATES.md). Minor and
# major updates wait for the user. Only for PRs opened by dependabot[bot]; no secret besides the job token.
# GitHub's auto-merge is enabled through the API, never through the gh merge command: without required checks on
# main, that command merges at once (PR #3, 2026-10-24), whereas the API call fails and nothing is merged.
name: dependabot-automerge

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql -f id="$PR_ID" -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId }
            }'
