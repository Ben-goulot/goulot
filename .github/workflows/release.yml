# Release (docs/UPDATES.md, « Côté GitHub »): every Monday or on demand, only if main changed since the last
# release. Job `build` has no secret; job `sign` runs only after the user's approval of the `release`
# environment, runs no third-party code (official actions pinned by commit, runner tools) and signs the manifest.
name: release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de version (patch par défaut)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit on main
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Plan
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main n'a pas changé depuis $last : rien à publier." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="$(uv run python -m goulot.updater.packaging version --bump "$BUMP")"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.publish == 'true'
        run: uv run pytest -q
      - if: steps.plan.outputs.publish == 'true'
        run: uv run python schemas/check_schemas.py
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - if: steps.plan.outputs.publish == 'true'
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Archive and notes
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
        run: |
          uv run python -m goulot.updater.packaging archive --version "$VERSION" --out release
          uv run python -m goulot.updater.packaging notes --since "$LAST" > release/notes_fr.txt
          {
            echo "## Goulot $VERSION : notes à lire avant d'approuver"
            echo
            echo '```'
            cat release/notes_fr.txt
            echo '```'
            echo
            echo "Archive : goulot-$VERSION.tar.gz, SHA-256 $(jq -r .sha256 release/meta.json), $(jq -r .size release/meta.json) octets."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/goulot-${{ steps.plan.outputs.version }}.tar.gz
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify provenance and hash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: release
        run: |
          archive="goulot-$VERSION.tar.gz"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          test "$(jq -r .version meta.json)" = "$VERSION"
          test "$(jq -r .commit meta.json)" = "$GITHUB_SHA"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$(jq -r .sha256 meta.json)"
          test "$(stat -c %s "$archive")" = "$(jq -r .size meta.json)"
      - name: Manifest and signature
        env:
          SIGNING_KEY: ${{ secrets.GOULOT_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: release
        run: |
          archive="goulot-$VERSION.tar.gz"
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg created_at "$(jq -r .created_at meta.json)" \
            --arg sha256 "$(sha256sum "$archive" | cut -d ' ' -f 1)" \
            --argjson size "$(stat -c %s "$archive")" \
            --argjson min_updater_version "$(jq .min_updater_version meta.json)" \
            --argjson migrations "$(jq -c .migrations meta.json)" \
            --rawfile notes_fr notes_fr.txt \
            '{name: "goulot", version: $version, commit: $commit, created_at: $created_at, sha256: $sha256,
              size: $size, min_updater_version: $min_updater_version, migrations: $migrations,
              notes_fr: $notes_fr}' > manifest.json
          umask 077
          key="$RUNNER_TEMP/signing.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in manifest.json -out manifest.json.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/signing.pub"
          shred -u "$key"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/signing.pub" -rawin -in manifest.json \
            -sigfile manifest.json.sig
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: release
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Goulot $VERSION" --notes-file notes_fr.txt \
            "goulot-$VERSION.tar.gz" manifest.json manifest.json.sig
